name: Project Health

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  health:
    name: Tests, lint, and health summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: python -m pip install --disable-pip-version-check ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run linting
        run: ruff check src tests

      - name: Generate health summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Project Health"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Unit tests and linting | ${{ job.status }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Workflow | ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER} |"
          } >> "$GITHUB_STEP_SUMMARY"
